name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pytest
      - run: python -m pytest -q
      - run: >
          pyinstaller --onefile --console --name shelf
          --add-data "toxshelf/tdside;toxshelf/tdside"
          --add-data "toxshelf/index.json;toxshelf"
          scripts/shelf.py
      - run: dist/shelf.exe --version
      - run: dist/shelf.exe --json search --index-only wintd
      - uses: actions/upload-artifact@v4
        with:
          name: shelf
          path: dist/shelf.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/shelf.exe
            install.ps1
          generate_release_notes: true
